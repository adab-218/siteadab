name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo p/ gerar-versoes.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run versoes
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: adab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
      - run: composer install --prefer-dist
        working-directory: api
      - run: composer test
        working-directory: api
        env:
          ADAB_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=adab_test;charset=utf8mb4"
          ADAB_TEST_USER: root
          ADAB_TEST_PASS: test_root
